<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - MEENAKARI WEAVERS</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#8b1e3f;
color:white;
text-align:center;
padding:20px;
}

.container{
width:90%;
max-width:1000px;
margin:30px auto;
}

.box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.product-row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #ddd;
}

.summary{
margin-top:20px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin:10px 0;
}

.total{
font-size:24px;
font-weight:bold;
color:#8b1e3f;
}

.btn{
width:100%;
padding:15px;
background:#8b1e3f;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

</style>

</head>

<body>

<header>
<h1>MEENAKARI WEAVERS</h1>
<p>Checkout</p>
</header>

<div class="container">

<div class="box">

<h2>Order Summary</h2>

<div id="checkoutItems"></div>

<div class="summary">

<div class="summary-row">
<span>Subtotal</span>
<span id="subtotal">₹0</span>
</div>

<div class="summary-row">
<span>GST (5%)</span>
<span id="gst">₹0</span>
</div>

<hr>

<div class="summary-row total">
<span>Total</span>
<span id="total">₹0</span>
</div>

<button class="btn" onclick="goPayment()">
Continue To Payment
</button>

</div>

</div>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let checkoutItems =
document.getElementById("checkoutItems");

let subtotal = 0;

if(cart.length===0){

checkoutItems.innerHTML =
"<h3>Your Cart Is Empty</h3>";

}else{

cart.forEach(item=>{

subtotal += Number(item.price);

checkoutItems.innerHTML += `

<div class="product-row">

<span>${item.name}</span>

<span>₹${item.price}</span>

</div>

`;

});

}

let gst =
Math.round(subtotal * 0.05);

let total =
subtotal + gst;

document.getElementById("subtotal").innerHTML =
"₹" + subtotal;

document.getElementById("gst").innerHTML =
"₹" + gst;

document.getElementById("total").innerHTML =
"₹" + total;

function goPayment(){

if(cart.length===0){

alert("Cart is Empty!");

return;

}

window.location.href = "payment.html";

}

</script>

</body>
</html>
