<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cart - MEENAKARI WEAVERS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8b1e3f;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
margin:auto;
padding:30px 0;
}

.cart-wrapper{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.cart-items{
flex:2;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.cart-item{
display:flex;
gap:20px;
padding:20px 0;
border-bottom:1px solid #ddd;
}

.cart-item img{
width:120px;
height:150px;
object-fit:cover;
border-radius:8px;
}

.item-details{
flex:1;
}

.price{
font-size:22px;
font-weight:bold;
color:#8b1e3f;
margin-top:10px;
}

.remove-btn{
margin-top:10px;
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.summary{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
height:fit-content;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.total{
font-size:24px;
font-weight:bold;
color:#8b1e3f;
}

.checkout-btn{
width:100%;
padding:12px;
background:#8b1e3f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:20px;
}

.empty{
text-align:center;
padding:40px;
font-size:20px;
}

</style>

</head>

<body>

<header>

<h1>MEENAKARI WEAVERS</h1>

<p>Your Shopping Cart</p>

</header>

<div class="container">

<div class="cart-wrapper">

<div class="cart-items">

<h2>Items in Cart</h2>

<div id="cartItems"></div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-row">

<span>Subtotal</span>

<span id="subtotal">₹0</span>

</div>

<div class="summary-row">

<span>GST (5%)</span>

<span id="gst">₹0</span>

</div>

<hr><br>

<div class="summary-row total">

<span>Total</span>

<span id="total">₹0</span>

</div>

<button
class="checkout-btn"
onclick="goCheckout()">

Proceed To Checkout

</button>

</div>

</div>

</div>

<script>

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

let cartItems =
document.getElementById("cartItems");

let subtotal = 0;

function loadCart(){

cartItems.innerHTML="";

subtotal = 0;

if(cart.length===0){

cartItems.innerHTML=

'<div class="empty">🛒 Cart is Empty</div>';

document.getElementById("subtotal")
.innerHTML="₹0";

document.getElementById("gst")
.innerHTML="₹0";

document.getElementById("total")
.innerHTML="₹0";

return;

}

cart.forEach((item,index)=>{

subtotal += Number(item.price);

cartItems.innerHTML += `

<div class="cart-item">

<img src="${item.image}">

<div class="item-details">

<h3>${item.name}</h3>

<p class="price">
₹${item.price}
</p>

<button
class="remove-btn"
onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

`;

});

let gst =
Math.round(subtotal * 0.05);

let total =
subtotal + gst;

document.getElementById("subtotal")
.innerHTML =
"₹" + subtotal;

document.getElementById("gst")
.innerHTML =
"₹" + gst;

document.getElementById("total")
.innerHTML =
"₹" + total;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

}

function goCheckout(){

if(cart.length===0){

alert(
"Your cart is empty!"
);

return;

}

window.location.href =
"checkout.html";

}

loadCart();

</script>

</body>

</html>
