<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Meenakari Weavers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8b1e3f;
color:white;
text-align:center;
padding:20px;
}

.container{
width:90%;
margin:auto;
padding:30px 0;
}

.checkout-wrapper{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.form-section{
flex:2;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.summary-section{
flex:1;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
height:fit-content;
}

h2{
margin-bottom:20px;
color:#8b1e3f;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
}

textarea{
resize:none;
height:100px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.total{
font-size:22px;
font-weight:bold;
color:#8b1e3f;
}

.pay-btn{
width:100%;
padding:14px;
background:#8b1e3f;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

.pay-btn:hover{
background:#6d1430;
}

</style>

</head>

<body>

<header>

<h1>Meenakari Weavers</h1>

<p>Checkout</p>

</header>

<div class="container">

<div class="checkout-wrapper">

<div class="form-section">

<h2>Delivery Details</h2>

<form>

<input
type="text"
placeholder="Full Name"
required>

<input
type="tel"
placeholder="Mobile Number"
required>

<textarea
placeholder="Complete Address"
required></textarea>

<input
type="text"
placeholder="City"
required>

<input
type="text"
placeholder="State"
required>

<input
type="text"
placeholder="Pincode"
required>

</form>

</div>

<div class="summary-section">

<h2>Order Summary</h2>

<div class="summary-row">

<span>Royal Silk Saree</span>

<span>₹2499</span>

</div>

<div class="summary-row">

<span>Peacock Blue Silk</span>

<span>₹2799</span>

</div>

<hr><br>

<div class="summary-row">

<span>Subtotal</span>

<span>₹5298</span>

</div>

<div class="summary-row">

<span>Discount</span>

<span>- ₹500</span>

</div>

<div class="summary-row">

<span>GST (5%)</span>

<span>₹239</span>

</div>

<hr><br>

<div class="summary-row total">

<span>Total</span>

<span>₹5037</span>

</div>

<a href="payment.html">

<button class="pay-btn">

Continue To Payment

</button>

</a>

</div>

</div>

</div>

</body>
</html>
