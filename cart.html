<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Meenakari Weavers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8b1e3f;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
padding:30px 0;
}

.cart-item{
display:flex;
gap:20px;
background:white;
padding:20px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
align-items:center;
}

.cart-item img{
width:120px;
height:150px;
object-fit:cover;
border-radius:8px;
}

.item-details{
flex:1;
}

.item-details h3{
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:bold;
color:#8b1e3f;
margin-bottom:10px;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}

.summary{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
margin-top:20px;
}

.summary h2{
margin-bottom:20px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.total{
font-size:26px;
font-weight:bold;
color:#8b1e3f;
}

.checkout-btn{
width:100%;
padding:12px;
background:#8b1e3f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:20px;
}

.empty-cart{
background:white;
padding:40px;
text-align:center;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
font-size:22px;
}

</style>

</head>

<body>

<header>

<h1>Meenakari Weavers</h1>

<p>Your Shopping Cart</p>

</header>

<div class="container">

<div id="cartItems"></div>

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-row">
<span>Subtotal</span>
<span id="subtotal">₹0</span>
</div>

<div class="summary-row">
<span>GST (5%)</span>
<span id="gst">₹0</span>
</div>

<hr><br>

<div class="summary-row total">
<span>Total</span>
<span id="total">₹0</span>
</div>

<a href="checkout.html">
<button class="checkout-btn">
Proceed To Checkout
</button>
</a>

</div>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let cartContainer =
document.getElementById("cartItems");

function loadCart(){

cartContainer.innerHTML = "";

let subtotal = 0;

if(cart.length === 0){

cartContainer.innerHTML = `
<div class="empty-cart">
Your Cart Is Empty
</div>
`;

document.getElementById("subtotal").innerHTML = "₹0";
document.getElementById("gst").innerHTML = "₹0";
document.getElementById("total").innerHTML = "₹0";

return;
}

cart.forEach((item,index)=>{

subtotal += Number(item.price);

cartContainer.innerHTML += `

<div class="cart-item">

<img src="${item.image}" alt="${item.name}">

<div class="item-details">

<h3>${item.name}</h3>

<p class="price">
₹${item.price}
</p>

<button
class="remove-btn"
onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

`;

});

let gst = Math.round(subtotal * 0.05);

let total = subtotal + gst;

document.getElementById("subtotal").innerHTML =
"₹" + subtotal;

document.getElementById("gst").innerHTML =
"₹" + gst;

document.getElementById("total").innerHTML =
"₹" + total;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

}

loadCart();

</script>

</body>
</html>
