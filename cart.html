<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Meenakari Weavers</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8b1e3f;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
margin:auto;
padding:30px 0;
}

.cart-wrapper{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.cart-items{
flex:2;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.cart-item{
display:flex;
gap:20px;
padding:20px 0;
border-bottom:1px solid #ddd;
}

.cart-item img{
width:120px;
height:150px;
object-fit:cover;
border-radius:8px;
}

.item-details{
flex:1;
}

.item-details h3{
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:bold;
color:#8b1e3f;
}

.qty{
margin-top:10px;
}

.qty select{
padding:5px;
}

.remove-btn{
margin-top:10px;
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.summary{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
height:fit-content;
}

.summary h2{
margin-bottom:20px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

.total{
font-size:24px;
font-weight:bold;
color:#8b1e3f;
}

.checkout-btn{
width:100%;
padding:12px;
background:#8b1e3f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:20px;
}

</style>

</head>

<body>

<header>

<h1>Meenakari Weavers</h1>

<p>Your Shopping Cart</p>

</header>

<div class="container">

<div class="cart-wrapper">

<div class="cart-items">

<h2>Items in Cart</h2>

<div class="cart-item">

<img src="images/royal-silk.jpg">

<div class="item-details">

<h3>Royal Silk Saree</h3>

<p class="price">₹2499</p>

<div class="qty">

Quantity:

<select>

<option>1</option>
<option>2</option>
<option>3</option>

</select>

</div>

<button class="remove-btn">

Remove

</button>

</div>

</div>

<div class="cart-item">

<img src="images/peacock-blue.jpg">

<div class="item-details">

<h3>Peacock Blue Silk Saree</h3>

<p class="price">₹2799</p>

<div class="qty">

Quantity:

<select>

<option>1</option>
<option>2</option>
<option>3</option>

</select>

</div>

<button class="remove-btn">

Remove

</button>

</div>

</div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="summary-row">

<span>Subtotal</span>

<span>₹5298</span>

</div>

<div class="summary-row">

<span>Discount</span>

<span>- ₹500</span>

</div>

<div class="summary-row">

<span>GST (5%)</span>

<span>₹239</span>

</div>

<hr><br>

<div class="summary-row total">

<span>Total</span>

<span>₹5037</span>

</div>

<a href="checkout.html">

<button class="checkout-btn">

Proceed To Checkout

</button>

</a>

</div>

</div>

</div>

</body>
</html>
