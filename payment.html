<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Payment - MEENAKARI WEAVERS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#8b1e3f;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:900px;
margin:30px auto;
padding:20px;
}

.payment-box{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h2{
color:#8b1e3f;
margin-bottom:20px;
}

.payment-option{
border:1px solid #ddd;
padding:15px;
margin-bottom:15px;
border-radius:8px;
cursor:pointer;
}

.payment-option:hover{
background:#faf2f5;
}

.payment-option input{
margin-right:10px;
}

.card-fields{
margin-top:20px;
}

.card-fields input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:6px;
}

.order-summary{
margin-top:25px;
background:#fafafa;
padding:15px;
border-radius:8px;
}

.product-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
padding-bottom:10px;
border-bottom:1px solid #ddd;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.total{
font-size:22px;
font-weight:bold;
color:#8b1e3f;
}

.pay-btn{
width:100%;
padding:15px;
background:#8b1e3f;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.pay-btn:hover{
background:#6d1430;
}

</style>

</head>

<body>

<header>

<h1>MEENAKARI WEAVERS</h1>

<p>Secure Payment Gateway</p>

</header>

<div class="container">

<div class="payment-box">

<h2>Select Payment Method</h2>

<label class="payment-option">
<input type="radio" name="payment" checked>
UPI Payment
</label>

<label class="payment-option">
<input type="radio" name="payment">
Credit Card
</label>

<label class="payment-option">
<input type="radio" name="payment">
Debit Card
</label>

<label class="payment-option">
<input type="radio" name="payment">
Net Banking
</label>

<label class="payment-option">
<input type="radio" name="payment">
Cash On Delivery
</label>

<div class="card-fields">

<input
type="text"
placeholder="Card Holder Name">

<input
type="text"
placeholder="Card Number">

<input
type="text"
placeholder="Expiry Date (MM/YY)">

<input
type="password"
placeholder="CVV">

</div>

<div class="order-summary">

<h3>Order Summary</h3>

<br>

<div id="paymentItems"></div>

<hr><br>

<div class="summary-row">
<span>Subtotal</span>
<span id="subtotal">₹0</span>
</div>

<div class="summary-row">
<span>GST (5%)</span>
<span id="gst">₹0</span>
</div>

<hr><br>

<div class="summary-row total">
<span>Total</span>
<span id="total">₹0</span>
</div>

</div>

<button
class="pay-btn"
onclick="payNow()">

Pay Now

</button>

</div>

</div>

<script>

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

let paymentItems =
document.getElementById(
"paymentItems"
);

let subtotal = 0;

cart.forEach(item=>{

subtotal +=
Number(item.price);

paymentItems.innerHTML += `

<div class="product-row">

<span>
${item.name}
</span>

<span>
₹${item.price}
</span>

</div>

`;

});

let gst =
Math.round(subtotal * 0.05);

let total =
subtotal + gst;

document
.getElementById("subtotal")
.innerHTML =
"₹" + subtotal;

document
.getElementById("gst")
.innerHTML =
"₹" + gst;

document
.getElementById("total")
.innerHTML =
"₹" + total;

function payNow(){

if(cart.length===0){

alert(
"No products found!"
);

return;

}

alert(
"Payment Successful!"
);

localStorage.removeItem("cart");

window.location.href =
"success.html";

}

</script>

</body>

</html>
